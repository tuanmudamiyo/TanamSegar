<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<script>
  try {
    var t = localStorage.getItem('tanamsegar_theme');
    if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>TanamSegar — Soil Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page-loader" id="pageLoader"><div class="loader"></div></div>
  <header>
    <div class="brand">
      <div class="brand-mark"><img src="logo.png" alt="TanamSegar logo" /></div>
      <div><h1>TanamSegar</h1><span>Preferred Soil Monitor Platform</span></div>
    </div>
    <div class="header-actions">
      <div class="live"><span class="dot" id="liveDot"></span><span id="liveTxt">Connecting…</span></div>
      <button type="button" id="themeBtn" class="icon-btn" title="Toggle theme"></button>
    </div>
  </header>

  <section id="view-home">
        <div class="plant-row">
      <span class="plant-label">Your plant is now:</span>
      <select id="plantSelect" class="plant-select">
        <option value="" disabled selected>Choose a plant</option>
        <option value="Mini Eggplant">🍆 Mini Eggplant</option>
        <option value="Cherry Tomato" disabled>🍅 Cherry Tomato (coming soon)</option>
        <option value="Chili Pepper" disabled>🌶️ Chili Pepper (coming soon)</option>
        <option value="Bell Pepper" disabled>🫑 Bell Pepper (coming soon)</option>
        <option value="Cucumber" disabled>🥒 Cucumber (coming soon)</option>
        <option value="Okra" disabled>🫛 Lady's Finger (coming soon)</option>
        <option value="Lettuce" disabled>🥬 Lettuce (coming soon)</option>
        <option value="Spinach" disabled>🥬 Spinach (coming soon)</option>
        <option value="Basil" disabled>🌿 Basil (coming soon)</option>
        <option value="Strawberry" disabled>🍓 Strawberry (coming soon)</option>
      </select>
    </div>

    <p class="section-label">Daylight · Light Level</p>
    <div class="daylight" id="daylight">
      <div class="ico" id="dlIco">☀️</div>
      <div class="txt">
        <div class="state" id="dlState">—</div>
        <div class="sub" id="dlSub">Waiting for sensor…</div>
      </div>
      <div class="lux"><span id="dlLux">—</span><small>light level</small></div>
    </div>

    <p class="section-label">Climate · Temperature &amp; Humidity</p>
    <div class="climate" id="climate"></div>

    <p class="section-label">Soil Nutrients (NPK)</p>
    <div class="npk" id="npk"></div>

    <p class="section-label">Soil Condition</p>
    <div class="soil" id="soil"></div>

    <p class="stamp" id="stamp">—</p>
  </section>

  <nav>
    <button class="active" id="navHome"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>Home</button>
    <button id="navAnalyze"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>Analyze</button>
    <button id="navTrends"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M7 14l4-4 3 3 5-6"/></svg>Trends</button>
    <button id="navProfile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>Profile</button>
  </nav>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, onValue, get, set } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  /* ============================================================
     1) FIREBASE CONFIG  —  paste your own values here.
        Firebase console -> Project settings -> Your apps
        -> SDK setup and configuration.
     ============================================================ */
  const firebaseConfig = {
    apiKey: "AIzaSyDmqth-CeM4IaWZXBK0SzKXvboCGYDLI10",
    authDomain: "iot-lstm-agriculture.firebaseapp.com",
    databaseURL: "https://iot-lstm-agriculture-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "iot-lstm-agriculture",
    storageBucket: "iot-lstm-agriculture.firebasestorage.app",
    messagingSenderId: "896953838868",
    appId: "1:896953838868:web:6a154d99e90f577515e601"
  };

  /* Expected shape of your Realtime Database node (path: /sensors):
     {
       "temperature": 29.7,   // DHT
       "humidity":    62.0,   // DHT
       "ldr":         820,    // raw LDR 0-1023. High = bright.
       "nitrogen":    876.0,  // mg/kg
       "phosphorus":  478.0,  // mg/kg
       "potassium":   72.0,   // mg/kg
       "moisture":    38.5,   // %
       "soilTemp":    27.4,   // °C
       "ec":          1.15,   // mS/cm
       "ph":          6.6
     }
  */

  const app = initializeApp(firebaseConfig);
  const db  = getDatabase(app);
  const auth = getAuth(app);

  const LDR_MAX = 4095;            // ESP32 ADC is 12-bit (0-4095)
  const LDR_DAY_THRESHOLD = 2000;  // above this = daytime (tune to your sensor)

  /* weak = arc start (light), strong = arc end (dark) */
  const climateCfg = [
    { key:'temperature', label:'Temperature', src:'Air', max:50,  weak:'#fecaca', strong:'#7f1d1d', unit:'°C', decimals:1 },
    { key:'humidity',    label:'Humidity',    src:'Air', max:100, weak:'#bae6fd', strong:'#0c4a6e', unit:'%',  decimals:1 }
  ];
  const npkCfg = [
    { key:'nitrogen',   name:'Nitrogen (N)',   role:'Leaf growth',      idealMin:25, idealMax:35,  color:'var(--sky)',    grad:'var(--npk-n-grad)', max:300,
      icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg>' },
    { key:'phosphorus', name:'Phosphorus (P)', role:'Root development', idealMin:40, idealMax:50,  color:'#f97316',       grad:'linear-gradient(135deg,#f97316,#facc15)', max:100,
      icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 20h10"/><path d="M10 20c5.5-2.5.8-6.4 3-10"/><path d="M9.5 9.4c1.1.8 1.8 2.2 2.3 3.7-2 .4-3.5.4-4.8-.3-1.2-.6-2.3-1.9-3-4.2 2.8-.5 4.4 0 5.5.8z"/><path d="M14.1 6a7 7 0 0 0-1.1 4c1.9-.1 3.3-.6 4.3-1.4 1-1 1.6-2.3 1.7-4.6-2.7.1-4 1-4.9 2z"/></svg>' },
    { key:'potassium',  name:'Potassium (K)',  role:'Fruit & health',   idealMin:80, idealMax:120, color:'var(--violet)', grad:'linear-gradient(135deg,#c4b5fd,#7c3aed)', max:250,
      icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.94c1.5 0 2.75 1.06 4 1.06 3 0 6-8 6-12.22A4.91 4.91 0 0 0 17 5c-2.22 0-4 1.44-5 2-1-.56-2.78-2-5-2a4.9 4.9 0 0 0-5 4.78C2 14 5 22 8 22c1.25 0 2.5-1.06 4-1.06Z"/><path d="M10 2c1 .5 2 2 2 5"/></svg>' }
  ];
  const soilCfg = [
    { key:'moisture', label:'Moisture',    max:100, weak:'#a5f3fc', strong:'#164e63', unit:'%',     decimals:1 },
    { key:'soilTemp', label:'Temperature', max:50,  weak:'#fed7aa', strong:'#7c2d12', unit:'°C',    decimals:1 },
    { key:'ec',       label:'EC',          max:3,   weak:'#f5d0fe', strong:'#701a75', unit:'mS/cm', decimals:2 },
    { key:'ph',       label:'pH',          max:14,  weak:'#bbf7d0', strong:'#14532d', unit:'',      decimals:1 }
  ];
  const R = 34, C = 2 * Math.PI * R;
  const $ = id => document.getElementById(id);

  /* ---- Theme (light/dark) ---- */
  const THEME_KEY = 'tanamsegar_theme';
  const moonIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>';
  const sunIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';

  function paintThemeBtn(){
    const theme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
    $('themeBtn').innerHTML = theme === 'dark' ? sunIcon : moonIcon;
  }
  paintThemeBtn();

  $('themeBtn').addEventListener('click', () => {
    const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem(THEME_KEY, next); } catch {}
    paintThemeBtn();
  });

  /* ---- Trend history: kept updated here too (even though Trends now
     lives on its own page) so data is already there when you switch over.
     Must match the keys tracked in trends.html. ---- */
  const HISTORY_MAX = 200;
  const HISTORY_KEY = 'tanamsegar_history_v1';
  const HISTORY_KEYS = ['temperature', 'humidity', 'ldr', 'nitrogen', 'phosphorus', 'potassium', 'moisture', 'soilTemp', 'ec', 'ph'];

  function loadHistory(){
    try {
      const raw = localStorage.getItem(HISTORY_KEY);
      if (raw) return JSON.parse(raw);
    } catch {}
    const h = {};
    HISTORY_KEYS.forEach(k => h[k] = []);
    return h;
  }
  const history = loadHistory();

  function saveHistory(){
    try { localStorage.setItem(HISTORY_KEY, JSON.stringify(history)); } catch {}
  }

  function pushHistory(d){
    const t = Date.now();
    HISTORY_KEYS.forEach(k => {
      const v = Number(d[k] ?? NaN);
      if (Number.isNaN(v)) return;
      const arr = history[k] || (history[k] = []);
      arr.push({ t, v });
      if (arr.length > HISTORY_MAX) arr.shift();
    });
    saveHistory();
  }

  function setLive(ok){
    $('liveDot').classList.toggle('on', ok);
    $('liveTxt').textContent = ok ? 'Live' : 'Offline';
  }

  /* Live turns off when no fresh data arrives for a while
     (the device pushes every ~3 s, so 15 s of silence = offline). */
  const LIVE_TIMEOUT_MS = 15000;
  let liveTimer = null;
  let firstSnap = true;   // the first snapshot is Firebase's cached last value,
                          // not proof the device is alive - don't count it
  function markLive(){
    setLive(true);
    clearTimeout(liveTimer);
    liveTimer = setTimeout(() => setLive(false), LIVE_TIMEOUT_MS);
  }
  function armOfflineTimer(){
    clearTimeout(liveTimer);
    liveTimer = setTimeout(() => setLive(false), LIVE_TIMEOUT_MS);
  }

  function renderGaugeGroup(containerId, cfg, d){
    $(containerId).innerHTML = cfg.map(g => {
      const val = Number(d[g.key] ?? 0);
      const frac = Math.min(val / g.max, 1);
      const dash = C * frac;
      const ang = frac * 2 * Math.PI;   // svg is rotated -90deg, so this lands at the arc's end
      const dotX = (42 + R * Math.cos(ang)).toFixed(1);
      const dotY = (42 + R * Math.sin(ang)).toFixed(1);
      return `
      <div class="gauge-card">
        <div class="gauge">
          <svg width="84" height="84" viewBox="0 0 84 84">
            <defs>
              <linearGradient id="gg-${g.key}" x1="1" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="${g.weak}"/>
                <stop offset="1" stop-color="${g.strong}"/>
              </linearGradient>
            </defs>
            <circle cx="42" cy="42" r="${R}" fill="none" stroke="var(--line)" stroke-width="8"/>
            <circle cx="42" cy="42" r="${R}" fill="none" stroke="url(#gg-${g.key})" stroke-width="8"
                    stroke-linecap="round" stroke-dasharray="${dash} ${C}"/>
            <circle cx="${dotX}" cy="${dotY}" r="5.5" fill="${g.strong}" stroke="var(--panel)" stroke-width="2"/>
          </svg>
          <div class="gauge-val">${val.toFixed(g.decimals ?? 1)}${g.unit ? `<small>${g.unit}</small>` : ''}</div>
        </div>
        <p>${g.label}</p>
        ${g.src ? `<div class="src">${g.src}</div>` : ''}
      </div>`;
    }).join('');
  }

  function renderNpk(d){
    $('npk').innerHTML = npkCfg.map(n => {
      const val = Number(d[n.key] ?? 0);
      const pct = Math.min(val / n.max, 1) * 100;
      const zoneLeft = n.idealMin / n.max * 100;
      const zoneWidth = (n.idealMax - n.idealMin) / n.max * 100;
      const status = val < n.idealMin ? ['low', 'Low'] : val > n.idealMax ? ['high', 'High'] : ['ok', 'Ideal'];
      return `
      <div class="npk-card" style="--c:${n.color};--grad:${n.grad}">
        <div class="npk-badge">${n.icon}</div>
        <div class="npk-body">
          <div class="name">${n.name}</div>
          <div class="role">${n.role}</div>
          <div class="ideal">Ideal ${n.idealMin}-${n.idealMax} mg/kg</div>
        </div>
        <div class="npk-read">
          <div class="num">${val.toFixed(0)}</div>
          <div class="unit">mg/kg</div>
          <span class="npk-chip ${status[0]}">${status[1]}</span>
        </div>
        <div class="npk-bar">
          <span class="zone" style="left:${zoneLeft}%;width:${zoneWidth}%"></span>
          <i data-w="${pct}"></i>
        </div>
      </div>`;
    }).join('');
    requestAnimationFrame(() =>
      document.querySelectorAll('.npk-bar i').forEach(el => el.style.width = el.dataset.w + '%'));
  }

  function renderDaylight(d){
    const raw = Number(d.ldr ?? 0);
    const isDay = raw >= LDR_DAY_THRESHOLD;
    const pct = Math.round(Math.min(raw / LDR_MAX, 1) * 100);
    $('dlIco').textContent = isDay ? '☀️' : '🌙';
    $('dlIco').style.setProperty('--c', isDay ? 'var(--amber)' : 'var(--violet)');
    $('dlState').textContent = isDay ? 'Daytime' : 'Night';
    $('dlSub').textContent = isDay ? 'Sunlight detected' : 'Low light detected';
    $('dlLux').textContent = pct + '%';
  }

  function stamp(){
    $('stamp').textContent = 'Updated ' +
      new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  }

  /* ---- Nav: Analyze and Trends live on their own pages ---- */
  $('navAnalyze').addEventListener('click', () => { window.location.href = 'analyze.html'; });
  $('navTrends').addEventListener('click', () => { window.location.href = 'trends.html'; });
  $('navProfile').addEventListener('click', () => { window.location.href = 'profile.html'; });

  /* ---- Plant picker: saved per-account so it persists across visits ---- */
  function plantRef(){
    const uid = auth.currentUser?.uid;
    return uid ? ref(db, `users/${uid}/plant`) : null;
  }

  async function loadPlant(){
    const r = plantRef();
    if (!r) return;
    try {
      const snap = await get(r);
      if (snap.exists()) $('plantSelect').value = snap.val();
    } catch (err) {
      console.error(err);
    }
  }

  $('plantSelect').addEventListener('change', () => {
    const r = plantRef();
    if (r) set(r, $('plantSelect').value);
  });

  /* ---- Idle auto sign-out: glass countdown warning, then back to the login page ---- */
  const IDLE_LIMIT_MS = 5 * 60 * 1000;
  const WARN_BEFORE_MS = 60 * 1000;   // countdown fills the last 60 s
  const WARN_RING_C = 2 * Math.PI * 54;
  let idleTimer = null, warnTimer = null, warnInterval = null;

  const warnEl = document.createElement('div');
  warnEl.className = 'idle-warn';
  warnEl.innerHTML = `
    <div class="idle-card">
      <div class="idle-ring">
        <svg viewBox="0 0 120 120">
          <circle class="track" cx="60" cy="60" r="54"/>
          <circle class="left" cx="60" cy="60" r="54" stroke-dasharray="${WARN_RING_C}"/>
        </svg>
        <span class="idle-count">60</span>
      </div>
      <h2>Still there?</h2>
      <p>You've been idle for a while.<br>Logging out soon to keep your data safe.</p>
      <button type="button" class="idle-stay">I'm still here</button>
    </div>`;
  document.body.appendChild(warnEl);

  function showIdleWarning(){
    const ring = warnEl.querySelector('.left');
    const count = warnEl.querySelector('.idle-count');
    const t0 = Date.now();
    warnEl.classList.add('on');
    const tick = () => {
      const left = Math.max(0, WARN_BEFORE_MS - (Date.now() - t0));
      const s = Math.ceil(left / 1000);
      count.textContent = s;
      ring.style.strokeDashoffset = WARN_RING_C * (1 - left / WARN_BEFORE_MS);
      warnEl.classList.toggle('urgent', s <= 10);
    };
    tick();
    warnInterval = setInterval(tick, 250);
  }

  function hideIdleWarning(){
    clearInterval(warnInterval);
    warnEl.classList.remove('on', 'urgent');
  }

  function resetIdleTimer(){
    clearTimeout(idleTimer);
    clearTimeout(warnTimer);
    hideIdleWarning();
    warnTimer = setTimeout(showIdleWarning, IDLE_LIMIT_MS - WARN_BEFORE_MS);
    idleTimer = setTimeout(() => signOut(auth), IDLE_LIMIT_MS);
  }

  ['mousedown', 'mousemove', 'keydown', 'touchstart', 'scroll', 'wheel'].forEach(evt =>
    document.addEventListener(evt, resetIdleTimer, { passive: true })
  );

  let sensorsStarted = false;

  onAuthStateChanged(auth, user => {
    if (!user) {
      clearTimeout(idleTimer);
      window.location.replace('index.html?form=1');
      return;
    }
    $('pageLoader').hidden = true;
    resetIdleTimer();
    loadPlant();
    if (sensorsStarted) return;
    sensorsStarted = true;
    onValue(ref(db, 'sensors'),
      snap => {
        const d = snap.val();
        if (!d) { setLive(false); return; }
        if (firstSnap) { firstSnap = false; armOfflineTimer(); }
        else markLive();
        renderGaugeGroup('climate', climateCfg, d);
        renderNpk(d);
        renderGaugeGroup('soil', soilCfg, d);
        renderDaylight(d);
        pushHistory(d);
        stamp();
      },
      err => { console.error(err); setLive(false); }
    );
  });
</script>
</body>
</html>
