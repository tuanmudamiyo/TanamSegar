<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<script>
  try {
    var t = localStorage.getItem('tanamsegar_theme');
    if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Profile — TanamSegar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page-loader" id="pageLoader"><div class="loader"></div></div>
  <header>
    <div class="brand">
      <div class="brand-mark"><img src="logo.png" alt="TanamSegar logo" /></div>
      <div><h1>TanamSegar</h1><span>Preferred Soil Monitor Platform</span></div>
    </div>
    <div class="header-actions">
      <button type="button" id="themeBtn" class="icon-btn" title="Toggle theme"></button>
    </div>
  </header>

  <section id="view-profile">
    <p class="section-label">Profile</p>
    <div class="profile-card">
      <div class="profile-avatar" id="profileAvatar">—</div>

      <div class="profile-name-row" id="nameDisplay">
        <div class="profile-name" id="profileName">—</div>
        <button type="button" id="editNameBtn" class="icon-btn tiny" title="Edit name">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        </button>
      </div>

      <form id="editNameForm" class="edit-name-form" hidden>
        <input type="text" id="editNameInput" class="text-input" placeholder="Your name" maxlength="60" autocomplete="name" />
        <div class="edit-name-actions">
          <button type="submit" class="import-btn">Save</button>
          <button type="button" id="cancelNameBtn" class="link-btn">Cancel</button>
        </div>
        <p class="field-error" id="editNameError"></p>
      </form>

      <div class="profile-email" id="profileEmail">—</div>
      <button type="button" id="signOutBtn" class="import-btn profile-signout">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
        Sign out
      </button>
    </div>
    <div class="profile-plant">
      <span class="label">Your plant</span>
      <span class="value" id="profilePlant">—</span>
    </div>
  </section>

  <nav>
    <button id="navHome"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>Home</button>
    <button id="navAnalyze"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>Analyze</button>
    <button id="navTrends"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M7 14l4-4 3 3 5-6"/></svg>Trends</button>
    <button class="active" id="navProfile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>Profile</button>
  </nav>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
  import { getAuth, onAuthStateChanged, signOut, updateProfile } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  /* Same project as home.html — keep these files in sync. */
  const firebaseConfig = {
    apiKey: "AIzaSyDmqth-CeM4IaWZXBK0SzKXvboCGYDLI10",
    authDomain: "iot-lstm-agriculture.firebaseapp.com",
    databaseURL: "https://iot-lstm-agriculture-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "iot-lstm-agriculture",
    storageBucket: "iot-lstm-agriculture.firebasestorage.app",
    messagingSenderId: "896953838868",
    appId: "1:896953838868:web:6a154d99e90f577515e601"
  };

  const app = initializeApp(firebaseConfig);
  const db  = getDatabase(app);
  const auth = getAuth(app);

  const $ = id => document.getElementById(id);

  /* ---- Theme (light/dark) ---- */
  const THEME_KEY = 'tanamsegar_theme';
  const moonIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>';
  const sunIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';

  function paintThemeBtn(){
    const theme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
    $('themeBtn').innerHTML = theme === 'dark' ? sunIcon : moonIcon;
  }
  paintThemeBtn();

  $('themeBtn').addEventListener('click', () => {
    const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem(THEME_KEY, next); } catch {}
    paintThemeBtn();
  });

  function initials(str){
    const s = (str || '').trim();
    if (!s) return '?';
    const parts = s.split(/\s+/);
    return parts.length > 1 ? (parts[0][0] + parts[1][0]).toUpperCase() : s[0].toUpperCase();
  }

  async function loadPlant(uid){
    try {
      const snap = await get(ref(db, `users/${uid}/plant`));
      $('profilePlant').textContent = snap.exists() && snap.val() ? snap.val() : 'Not chosen yet';
    } catch (err) {
      console.error(err);
      $('profilePlant').textContent = '—';
    }
  }

  /* ---- Edit display name ---- */
  $('editNameBtn').addEventListener('click', () => {
    $('editNameError').textContent = '';
    $('editNameInput').value = auth.currentUser?.displayName || '';
    $('nameDisplay').hidden = true;
    $('editNameForm').hidden = false;
    $('editNameInput').focus();
  });

  $('cancelNameBtn').addEventListener('click', () => {
    $('editNameForm').hidden = true;
    $('nameDisplay').hidden = false;
  });

  $('editNameForm').addEventListener('submit', async e => {
    e.preventDefault();
    const name = $('editNameInput').value.trim();
    const errEl = $('editNameError');
    if (!name) {
      errEl.textContent = 'Name cannot be empty.';
      return;
    }
    errEl.textContent = '';
    try {
      await updateProfile(auth.currentUser, { displayName: name });
      $('profileName').textContent = name;
      $('profileAvatar').textContent = initials(name);
      $('editNameForm').hidden = true;
      $('nameDisplay').hidden = false;
    } catch (err) {
      console.error(err);
      errEl.textContent = 'Could not save your name. Please try again.';
    }
  });

  /* ---- Nav ---- */
  $('navHome').addEventListener('click', () => { window.location.href = 'home.html'; });
  $('navAnalyze').addEventListener('click', () => { window.location.href = 'analyze.html'; });
  $('navTrends').addEventListener('click', () => { window.location.href = 'trends.html'; });

  /* ---- Sign out ---- */
  $('signOutBtn').addEventListener('click', () => signOut(auth));

  /* ---- Idle auto sign-out: glass countdown warning, then back to the login page ---- */
  const IDLE_LIMIT_MS = 5 * 60 * 1000;
  const WARN_BEFORE_MS = 60 * 1000;   // countdown fills the last 60 s
  const WARN_RING_C = 2 * Math.PI * 54;
  let idleTimer = null, warnTimer = null, warnInterval = null;

  const warnEl = document.createElement('div');
  warnEl.className = 'idle-warn';
  warnEl.innerHTML = `
    <div class="idle-card">
      <div class="idle-ring">
        <svg viewBox="0 0 120 120">
          <circle class="track" cx="60" cy="60" r="54"/>
          <circle class="left" cx="60" cy="60" r="54" stroke-dasharray="${WARN_RING_C}"/>
        </svg>
        <span class="idle-count">60</span>
      </div>
      <h2>Still there?</h2>
      <p>You've been idle for a while.<br>Logging out soon to keep your data safe.</p>
      <button type="button" class="idle-stay">I'm still here</button>
    </div>`;
  document.body.appendChild(warnEl);

  function showIdleWarning(){
    const ring = warnEl.querySelector('.left');
    const count = warnEl.querySelector('.idle-count');
    const t0 = Date.now();
    warnEl.classList.add('on');
    const tick = () => {
      const left = Math.max(0, WARN_BEFORE_MS - (Date.now() - t0));
      const s = Math.ceil(left / 1000);
      count.textContent = s;
      ring.style.strokeDashoffset = WARN_RING_C * (1 - left / WARN_BEFORE_MS);
      warnEl.classList.toggle('urgent', s <= 10);
    };
    tick();
    warnInterval = setInterval(tick, 250);
  }

  function hideIdleWarning(){
    clearInterval(warnInterval);
    warnEl.classList.remove('on', 'urgent');
  }

  function resetIdleTimer(){
    clearTimeout(idleTimer);
    clearTimeout(warnTimer);
    hideIdleWarning();
    warnTimer = setTimeout(showIdleWarning, IDLE_LIMIT_MS - WARN_BEFORE_MS);
    idleTimer = setTimeout(() => signOut(auth), IDLE_LIMIT_MS);
  }

  ['mousedown', 'mousemove', 'keydown', 'touchstart', 'scroll', 'wheel'].forEach(evt =>
    document.addEventListener(evt, resetIdleTimer, { passive: true })
  );

  onAuthStateChanged(auth, user => {
    if (!user) {
      clearTimeout(idleTimer);
      window.location.replace('index.html?form=1');
      return;
    }
    $('pageLoader').hidden = true;
    resetIdleTimer();
    $('profileName').textContent = user.displayName || 'TanamSegar user';
    $('profileEmail').textContent = user.email || '';
    $('profileAvatar').textContent = initials(user.displayName || user.email);
    loadPlant(user.uid);
  });
</script>
</body>
</html>
