<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>TanamSegar.com</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --sky:#0ea5e9;
    --sky-light:#7dd3fc;
    --clay:#f3735c;
    --card-text:#e8f2fb;
    --card-muted:#b4c8dc;
    --radius:26px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{
    font-family:'Inter',system-ui,sans-serif;
    background:
      radial-gradient(120% 90% at 20% 0%, #15395c 0%, transparent 60%),
      radial-gradient(100% 80% at 85% 100%, #0c2f4d 0%, transparent 55%),
      #0a1420;
    color:var(--card-text);
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    padding:24px;
    overflow:hidden;
    position:relative;
  }
  /* Slowly drifting colour wash behind everything */
  .bg-wash{
    position:fixed;inset:-25%;z-index:0;pointer-events:none;
    background:
      radial-gradient(38% 42% at 22% 28%, rgba(56,189,248,.42) 0%, transparent 70%),
      radial-gradient(45% 40% at 78% 70%, rgba(2,132,199,.40) 0%, transparent 72%),
      radial-gradient(32% 36% at 62% 16%, rgba(125,211,252,.22) 0%, transparent 70%);
    filter:blur(44px);
    animation:wash 26s ease-in-out infinite alternate;
  }
  @keyframes wash{
    0%  {transform:translate3d(0,0,0) scale(1)}
    50% {transform:translate3d(3%,-2%,0) scale(1.08)}
    100%{transform:translate3d(-2%,3%,0) scale(1.04)}
  }
  @media (prefers-reduced-motion:reduce){ .bg-wash{animation:none} }

  /* ---- Floating glass logo badge ---- */
  .logo-badge{
    display:grid;place-items:center;
    width:84px;height:84px;border-radius:50%;
    background:rgba(12,30,50,.42);
    -webkit-backdrop-filter:blur(18px) saturate(1.3);
    backdrop-filter:blur(18px) saturate(1.3);
    border:1px solid rgba(255,255,255,.28);
    box-shadow:0 14px 34px -14px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.25);
    animation:floaty 4.5s ease-in-out infinite;
  }
  .logo-badge img{width:62%;height:62%;object-fit:contain}
  @keyframes floaty{50%{transform:translateY(-7px)}}
  .splash-logo{
    width:130px;height:122px;
    align-self:flex-end;margin:0 34px 22px 0;
    background:none;-webkit-backdrop-filter:none;backdrop-filter:none;
    border:none;box-shadow:none;
    animation:fadeUp .8s cubic-bezier(.22,1,.36,1) both, floaty 4.5s ease-in-out .9s infinite;
  }
  .splash-logo img{width:100%;height:100%}
  .card-logo{
    position:absolute;top:-46px;left:12px;width:78px;height:78px;
    background:none;-webkit-backdrop-filter:none;backdrop-filter:none;
    border:none;box-shadow:none;
  }
  .card-logo img{width:100%;height:100%}

  /* ---- Welcome splash (stage 1) ---- */
  .welcome{
    position:fixed;inset:0;z-index:2;
    display:flex;flex-direction:column;justify-content:flex-end;
    transition:transform .65s cubic-bezier(.55,0,.3,1);
    will-change:transform;
  }
  .welcome.hide{transform:translateY(105%);pointer-events:none}
  .welcome .wave{display:block;width:100%;height:74px;margin-bottom:-1px}
  .welcome-panel{
    background:#fff;color:#0f1e2e;
    padding:6px 32px 58px;
  }
  .welcome-panel h1{
    font-family:'Space Grotesk';font-size:36px;font-weight:700;
    animation:fadeUp .7s cubic-bezier(.22,1,.36,1) both;
  }
  .welcome-panel p{
    font-size:14px;color:#6b8299;margin:6px 0 22px;
    animation:fadeUp .7s cubic-bezier(.22,1,.36,1) .12s both;
  }
  .arrow-btn{
    background:none;border:none;cursor:pointer;padding:6px 4px;
    color:var(--sky);display:inline-flex;align-items:center;
    animation:fadeUp .7s cubic-bezier(.22,1,.36,1) .24s both;
  }
  .arrow-btn svg{width:34px;height:24px;animation:nudge 1.6s ease-in-out infinite}
  @keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(7px)}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

  /* ---- Login card (stage 2) ---- */
  .login-card{
    position:relative;z-index:1;
    width:100%;max-width:360px;
    background:rgba(12,30,50,.52);
    -webkit-backdrop-filter:blur(24px) saturate(1.35);
    backdrop-filter:blur(24px) saturate(1.35);
    border:1px solid rgba(255,255,255,.18);
    border-radius:var(--radius);
    box-shadow:0 24px 60px -24px rgba(0,0,0,.6), 0 0 44px -14px rgba(56,189,248,.20), inset 0 1px 0 rgba(255,255,255,.22);
    padding:34px 28px 28px;
    opacity:0;transform:translateY(30px) scale(.97);pointer-events:none;
    transition:opacity .55s ease .15s, transform .6s cubic-bezier(.22,1,.36,1) .15s;
  }
  .login-card.show{opacity:1;transform:none;pointer-events:auto}
  .login-card h1{font-family:'Space Grotesk';font-size:28px;font-weight:700;margin-bottom:6px}
  .login-card .sub{font-size:13px;color:var(--card-muted);margin-bottom:24px}

  #loginForm{display:flex;flex-direction:column;gap:14px}
  .field{position:relative;display:block}
  .field > span{
    position:absolute;top:50%;left:15px;transform:translateY(-50%);
    font-size:15px;font-weight:500;color:var(--card-muted);
    pointer-events:none;
    transition:top .18s ease, transform .18s ease, font-size .18s ease, color .18s ease;
  }
  .field input:focus ~ span,
  .field input:not(:placeholder-shown) ~ span{
    top:9px;transform:none;
    font-size:11px;color:var(--sky-light);
  }
  .field input{
    width:100%;
    font-family:inherit;font-size:15px;
    padding:26px 44px 9px 14px;
    border-radius:14px;
    border:1px solid rgba(14,165,233,.45);
    background:rgba(255,255,255,.07);
    color:var(--card-text);
    outline:none;
    transition:border-color .2s ease, box-shadow .2s ease, background .2s ease;
  }
  .field input::placeholder{color:transparent}
  .field input:focus{border-color:var(--sky);box-shadow:0 0 0 1px var(--sky), 0 0 14px rgba(14,165,233,.35);background:rgba(255,255,255,.1)}
  .pw-eye{
    position:absolute;top:50%;right:10px;transform:translateY(-50%);
    background:none;border:none;cursor:pointer;color:var(--card-muted);
    width:30px;height:30px;display:grid;place-items:center;
  }
  .pw-eye svg{width:19px;height:19px}

  .row-between{display:flex;align-items:center;justify-content:space-between;margin-top:2px}
  .remember{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--card-muted);cursor:pointer}
  .remember input{width:16px;height:16px;accent-color:var(--sky);cursor:pointer}
  .text-link{background:none;border:none;font-family:inherit;font-size:13px;color:var(--sky-light);cursor:pointer}
  .text-link:hover{text-decoration:underline}

  .login-btn{
    position:relative;
    font-family:inherit;font-size:14px;font-weight:600;
    padding:14px;border-radius:14px;border:none;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
    transition:background .3s ease, transform .15s ease, opacity .2s ease;
  }
  .login-btn:active{transform:scale(.98)}
  .login-btn.primary{
    margin-top:6px;
    background:linear-gradient(135deg,#38bdf8,#0284c7);
    color:#fff;
  }
  .login-btn.primary.loading{pointer-events:none}
  .login-btn.primary.loading .btn-label{visibility:hidden}
  .login-btn.primary.loading::after{
    content:"";position:absolute;
    width:18px;height:18px;border-radius:50%;
    border:2px solid rgba(255,255,255,.35);border-top-color:#fff;
    animation:spin .8s linear infinite;
  }
  .login-btn.primary.success{
    background:linear-gradient(135deg,#22d3ee,#0284c7);
    pointer-events:none;
  }
  @keyframes spin{100%{transform:rotate(1turn)}}

  .status{font-size:12px;color:var(--card-muted);text-align:center;min-height:15px;margin-top:2px}
  .status:empty{min-height:0;margin-top:0}

  .divider{display:flex;align-items:center;gap:10px;margin:18px 0 14px;color:var(--card-muted);font-size:12px}
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:rgba(255,255,255,.18)}

  .login-btn.google{
    background:rgba(255,255,255,.1);
    color:var(--card-text);
    border:1px solid rgba(255,255,255,.2);
  }
  .login-btn.google:hover{background:rgba(255,255,255,.16)}
  .login-btn.google svg{width:18px;height:18px}

  .login-error{color:var(--clay);font-size:12px;text-align:center;margin-top:12px;min-height:15px}
  .login-error:empty{margin-top:0;min-height:0}
  .login-error.success{color:#7dd3fc}
</style>
</head>
<body>
  <div class="bg-wash"></div>

  <div class="welcome" id="welcomeScreen">
    <div class="logo-badge splash-logo"><img src="logo.png" alt="TanamSegar logo" /></div>
    <svg class="wave" viewBox="0 0 375 74" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0,46 C70,6 150,72 235,30 C295,2 340,18 375,40 L375,74 L0,74 Z" fill="#ffffff"/>
    </svg>
    <div class="welcome-panel">
      <h1>Welcome</h1>
      <p>Log in to continue to TanamSegar.</p>
      <button type="button" id="welcomeNext" class="arrow-btn" aria-label="Continue to log in">
        <svg viewBox="0 0 34 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12h28"/><path d="M22 4l8 8-8 8"/></svg>
      </button>
    </div>
  </div>

  <div class="login-card">
    <div class="logo-badge card-logo"><img src="logo.png" alt="TanamSegar logo" /></div>
    <h1 id="cardTitle">Welcome back</h1>
    <p class="sub" id="cardSub">Log in to continue to TanamSegar</p>

    <form id="loginForm">
      <label class="field">
        <input type="email" id="loginEmail" placeholder=" " required autocomplete="username" />
        <span>Email</span>
      </label>
      <label class="field">
        <input type="password" id="loginPassword" placeholder=" " required autocomplete="current-password" />
        <span>Password</span>
        <button type="button" id="pwToggle" class="pw-eye" aria-label="Show password"></button>
      </label>

      <div class="row-between">
        <label class="remember"><input type="checkbox" id="rememberMe" checked /><span>Remember me</span></label>
        <button type="button" id="forgotBtn" class="text-link">Forgot password?</button>
      </div>

      <button type="submit" class="login-btn primary" id="submitBtn"><span class="btn-label" id="btnLabel">Log In</span></button>
      <p class="status" id="statusMsg"></p>
    </form>

    <div class="divider"><span>or continue with</span></div>

    <button type="button" id="googleBtn" class="login-btn google">
      <svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.6-6 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l5.7-5.7C34.6 6 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.8 1.1 8 3l5.7-5.7C34.6 6 29.6 4 24 4c-7.5 0-14 4.2-17.7 10.7z"/><path fill="#4CAF50" d="M24 44c5.5 0 10.5-1.9 14.3-5.2l-6.6-5.6C29.6 34.9 26.9 36 24 36c-5.3 0-9.7-3.4-11.3-8l-6.6 5.1C9.9 39.6 16.4 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.2-4.1 5.6l6.6 5.6C41.6 36 44 30.5 44 24c0-1.3-.1-2.7-.4-3.5z"/></svg>
      Google
    </button>

    <p class="login-error" id="loginError"></p>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getAuth, onAuthStateChanged,
    signInWithEmailAndPassword,
    sendPasswordResetEmail, setPersistence,
    browserLocalPersistence, browserSessionPersistence,
    GoogleAuthProvider, signInWithPopup
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  /* Same project as home.html — keep these two files in sync. */
  const firebaseConfig = {
    apiKey: "AIzaSyDmqth-CeM4IaWZXBK0SzKXvboCGYDLI10",
    authDomain: "iot-lstm-agriculture.firebaseapp.com",
    databaseURL: "https://iot-lstm-agriculture-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "iot-lstm-agriculture",
    storageBucket: "iot-lstm-agriculture.firebasestorage.app",
    messagingSenderId: "896953838868",
    appId: "1:896953838868:web:6a154d99e90f577515e601"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const googleProvider = new GoogleAuthProvider();

  const $ = id => document.getElementById(id);

  /* ---- Welcome splash <-> login form ----
     Splash shows on load; tap ANYWHERE (or press Enter) to open the form.
     Leave the login page untouched for 30 min and the splash returns. */
  const SPLASH_IDLE_MS = 30 * 60 * 1000;
  const loginCard = document.querySelector('.login-card');
  let splashIdleTimer = null;

  function showLoginForm(){
    if ($('welcomeScreen').classList.contains('hide')) return;
    $('welcomeScreen').classList.add('hide');
    loginCard.classList.add('show');
    setTimeout(() => $('loginEmail').focus(), 700);  // ready to type right away
  }
  function showSplash(){
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    $('welcomeScreen').classList.remove('hide');
    loginCard.classList.remove('show');
  }
  function resetSplashIdle(){
    clearTimeout(splashIdleTimer);
    splashIdleTimer = setTimeout(showSplash, SPLASH_IDLE_MS);
  }

  $('welcomeScreen').addEventListener('click', showLoginForm);
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !$('welcomeScreen').classList.contains('hide')) {
      e.preventDefault();
      showLoginForm();
    }
  });
  ['mousedown', 'mousemove', 'keydown', 'touchstart', 'scroll', 'wheel'].forEach(evt =>
    document.addEventListener(evt, resetSplashIdle, { passive: true })
  );
  resetSplashIdle();

  /* Arriving from an auto/manual sign-out (index.html?form=1):
     jump straight to the form, no splash animation. */
  if (new URLSearchParams(location.search).has('form')) {
    const ws = $('welcomeScreen');
    ws.style.transition = 'none';
    loginCard.style.transition = 'none';
    ws.classList.add('hide');
    loginCard.classList.add('show');
    void ws.offsetHeight;   // apply both states instantly, no animation
    ws.style.transition = '';
    loginCard.style.transition = '';
    setTimeout(() => $('loginEmail').focus(), 300);
  }

  function friendlyAuthError(err){
    const map = {
      'auth/invalid-email':      'That email address looks invalid.',
      'auth/user-disabled':      'This account has been disabled.',
      'auth/user-not-found':     'No account found with that email.',
      'auth/wrong-password':     'Incorrect email or password.',
      'auth/invalid-credential': 'Incorrect email or password.',
      'auth/missing-password':   'Enter your password.',
      'auth/too-many-requests':  'Too many attempts — try again later.',
      'auth/popup-closed-by-user': 'Sign-in cancelled.'
    };
    return map[err.code] || 'Something went wrong. Please try again.';
  }

  /* ---- Password eye toggle ---- */
  const eyeIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>';
  const eyeOffIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.9 17.9A10.4 10.4 0 0 1 12 20c-7 0-11-8-11-8a20.3 20.3 0 0 1 5.1-6.1M9.9 4.2A9.9 9.9 0 0 1 12 4c7 0 11 8 11 8a20.4 20.4 0 0 1-3.1 4.2"/><path d="M14.1 14.1a3 3 0 1 1-4.2-4.2"/><path d="M1 1l22 22"/></svg>';
  $('pwToggle').innerHTML = eyeIcon;
  $('pwToggle').addEventListener('click', () => {
    const pw = $('loginPassword');
    const show = pw.type === 'password';
    pw.type = show ? 'text' : 'password';
    $('pwToggle').innerHTML = show ? eyeOffIcon : eyeIcon;
  });

  /* ---- Success sound: a short bell-like "ting" (no audio file needed) ----
     Tune it here: */
  const TING_VOLUME   = 0.25;   // subtle UI-feedback level (~-24 dB), the web-standard feel
  const TING_PITCH    = 1046.5; // base frequency in Hz (1046.5 = C6; lower = deeper, higher = brighter)
  const TING_LENGTH   = 1.2;    // fade-out time in seconds
  function playTing(){
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const now = ctx.currentTime;
      [[TING_PITCH, .20], [TING_PITCH * 2, .08]].forEach(([freq, vol]) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(vol * TING_VOLUME, now);
        gain.gain.exponentialRampToValueAtTime(.0001, now + TING_LENGTH);
        osc.connect(gain).connect(ctx.destination);
        osc.start(now);
        osc.stop(now + TING_LENGTH);
      });
    } catch (e) { /* sound is a nice-to-have; never block login on it */ }
  }

  /* ---- Button state helpers ---- */
  const checkIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" style="width:20px;height:20px"><path d="M4 12.5l5.5 5.5L20 6.5"/></svg>';
  function setLoading(on){
    $('submitBtn').classList.toggle('loading', on);
    $('statusMsg').textContent = on ? 'Signing you in…' : '';
  }
  function setSuccess(msg){
    const btn = $('submitBtn');
    btn.classList.remove('loading');
    btn.classList.add('success');
    $('btnLabel').innerHTML = checkIcon;
    $('btnLabel').style.visibility = 'visible';
    $('statusMsg').textContent = msg;
    playTing();
  }

  /* ---- Redirect: pause briefly after an interactive login so the
     success state is visible; instant if already signed in. ---- */
  let showSuccessFirst = false;
  onAuthStateChanged(auth, user => {
    if (!user) return;
    if (showSuccessFirst) {
      setTimeout(() => window.location.replace('home.html'), 1300);
    } else {
      window.location.replace('home.html');
    }
  });

  async function applyPersistence(){
    try {
      await setPersistence(auth, $('rememberMe').checked ? browserLocalPersistence : browserSessionPersistence);
    } catch (e) { console.error(e); }
  }

  $('loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    const errEl = $('loginError');
    errEl.classList.remove('success');
    errEl.textContent = '';
    setLoading(true);
    try {
      await applyPersistence();
      const email = $('loginEmail').value.trim();
      const pw = $('loginPassword').value;
      showSuccessFirst = true;
      await signInWithEmailAndPassword(auth, email, pw);
      setSuccess('Welcome back!');
    } catch (err) {
      showSuccessFirst = false;
      setLoading(false);
      errEl.textContent = friendlyAuthError(err);
    }
  });

  $('googleBtn').addEventListener('click', async () => {
    const errEl = $('loginError');
    errEl.classList.remove('success');
    errEl.textContent = '';
    try {
      await applyPersistence();
      showSuccessFirst = true;
      await signInWithPopup(auth, googleProvider);
      setSuccess('Welcome back!');
    } catch (err) {
      showSuccessFirst = false;
      errEl.textContent = friendlyAuthError(err);
    }
  });

  $('forgotBtn').addEventListener('click', async () => {
    const errEl = $('loginError');
    const email = $('loginEmail').value.trim();
    errEl.classList.remove('success');
    if (!email) {
      errEl.textContent = 'Enter your email above first, then tap "Forgot password?".';
      return;
    }
    try {
      await sendPasswordResetEmail(auth, email);
      errEl.classList.add('success');
      errEl.textContent = 'Password reset email sent — check your inbox.';
    } catch (err) {
      errEl.textContent = friendlyAuthError(err);
    }
  });
</script>
</body>
</html>
